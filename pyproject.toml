[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunil-ragkit"
version = "1.0.0"
description = "A local document workspace with inspectable hybrid retrieval and cited answers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sunil Kumar" }]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "httpx>=0.27,<1"]
dense = ["sentence-transformers>=5,<6", "qdrant-client>=1.15,<2"]
providers = ["openai>=2,<3", "anthropic>=0.70,<1", "httpx>=0.27,<1"]
mcp = ["mcp>=1.20,<2"]
langchain = ["langchain-core>=1,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/sunilkumar123ss/RagKit"

[tool.setuptools.packages.find]
include = ["ragkit*"]

[tool.setuptools.package-data]
ragkit = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
norecursedirs = [".git", ".venv", ".ragkit", "build", "dist"]
markers = ["live_models: downloads and runs actual local embedding/reranking models"]
