name: Verify RagKit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_models:
        description: Download and test the actual embedding and reranker models
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[web,providers,mcp,langchain,dev]' 'qdrant-client>=1.15,<2'
      - run: python -m pytest -q -m 'not live_models'
      - run: python -m ragkit --help
      - run: python main.py
      - run: python -m build
  actual-models:
    if: github.event_name == 'workflow_dispatch' && inputs.live_models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[web,dense,providers,mcp,langchain,dev]'
      - run: python -m pytest -q -m live_models
        env:
          RAGKIT_RUN_LIVE_MODELS: "1"
          TOKENIZERS_PARALLELISM: "false"
