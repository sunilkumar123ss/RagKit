services:
  ragkit:
    build:
      context: .
      args:
        RAGKIT_EXTRAS: ${RAGKIT_EXTRAS:-web,dense,providers,mcp,langchain}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ragkit-data:/data
    environment:
      RAGKIT_DATA_DIR: /data/corpus
      HF_HOME: /data/models
      RAGKIT_EMBEDDING_MODEL: ${RAGKIT_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAGKIT_RERANKER_MODEL: ${RAGKIT_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      RAGKIT_OLLAMA_MODEL: ${RAGKIT_OLLAMA_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAGKIT_OPENAI_MODEL: ${RAGKIT_OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAGKIT_ANTHROPIC_MODEL: ${RAGKIT_ANTHROPIC_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  ragkit-data:
